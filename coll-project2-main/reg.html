<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voter Registration | Click2Web</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="reg.css">
</head>

<body>
<div class="wrapper">
<div class="register-box">
<h2>Voter Registration</h2>
<p class="subtitle">Secure Digital Registration</p>
<form onsubmit="return false">

<div class="input-box">
<label>Full Name</label>
<input type="text" id="fullname" placeholder="Enter full name" required>
</div>

<div class="input-box">
<label>Phone Number</label>
<input type="text" id="phone" maxlength="10" placeholder="10 digit phone"
oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
</div>

<div class="input-box">
<label>Aadhaar Number</label>
<input type="text" id="aadhaar" maxlength="12" placeholder="12 digit Aadhaar"
oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
</div>

<!-- Current Address Field -->
<div class="input-box">
<label>Current Address</label>
<input type="text" id="address" placeholder="Enter your current address" required>
</div>

<div class="input-box">
<label>Profile Photo</label>
<input type="file" id="photo" accept="image/*" required>
</div>

<button class="otp-btn" type="button" onclick="sendOTP()">Send OTP</button>

<div class="otp-row">
<div class="input-box otp-input">
<label>Aadhaar OTP</label>
<input type="text" id="otp" maxlength="6" placeholder="6 digit OTP"
oninput="this.value=this.value.replace(/[^0-9]/g,'')">
</div>

<button type="button" class="otp-btn" onclick="verifyOTP()">Verify OTP</button>
</div>

<button class="register-btn" type="button" onclick="register()">Register Now</button>
<p id="msg" class="footer-text"></p>
</form>
</div>
</div>

<script>
let generatedOTP="";

// Send OTP
function sendOTP(){
    let phone=document.getElementById("phone").value;
    let aadhaar=document.getElementById("aadhaar").value;

    if(phone.length!=10 || aadhaar.length!=12){
        alert("Enter valid Phone & Aadhaar");
        return;
    }

    generatedOTP=Math.floor(100000+Math.random()*900000);
    alert("Demo OTP: "+generatedOTP);
}

// Verify OTP
function verifyOTP(){
    let otp=document.getElementById("otp").value;

    if(generatedOTP===""){
        document.getElementById("msg").innerHTML="Please send OTP first";
        return;
    }

    if(parseInt(otp)===generatedOTP){
        document.getElementById("msg").innerHTML="✓ OTP Verified Successfully";
    }else{
        document.getElementById("msg").innerHTML="Invalid OTP";
    }
}

// Register
function register(){
    console.log("Register clicked");
    console.log("Message content:", document.getElementById("msg").innerHTML);

    if(!document.getElementById("msg").innerHTML.includes("Verified")){
        alert("Please verify OTP first");
        return;
    }

    let fullname=document.getElementById("fullname").value;
    let phone=document.getElementById("phone").value;
    let aadhaar=document.getElementById("aadhaar").value;
    let address=document.getElementById("address").value;
    let photoInput = document.getElementById("photo");

    console.log("Fields:", {fullname, phone, aadhaar, address, photoSelected: !!photoInput.files[0]});

    if(fullname=="" || phone=="" || aadhaar=="" || address==""){
        alert("Please fill all details");
        return;
    }

    if (!photoInput.files[0]) {
        alert("Please select a profile photo");
        return;
    }

    let reader = new FileReader();
    reader.onload = function() {
        // Get existing users from localStorage
        let users = JSON.parse(localStorage.getItem("users")) || [];

        // Check if Aadhaar already exists
        if(users.some(u=>u.aadhaar===aadhaar)){
            alert("This Aadhaar is already registered!");
            return;
        }

        // Store user info in localStorage (without the large photo data)
        users.push({fullname, phone, aadhaar, address, photoUploaded: true});
        localStorage.setItem("users", JSON.stringify(users));

        // Redirect to login page
        alert("Registration Successful! Please login.");
        window.location.href="Login.html";
    };
    reader.readAsDataURL(photoInput.files[0]);
}
</script>
</body>
</html>
