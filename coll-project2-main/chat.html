<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
</head>
<body style="font-family:Arial; display:flex; flex-direction:column; align-items:center; padding-top:50px;">

<h2>Live Chat</h2>

<div id="chatBox" style="width:300px; height:300px; border:1px solid #ccc; overflow-y:auto; padding:10px; margin-bottom:10px;"></div>

<input type="text" id="messageInput" placeholder="Type message..." style="padding:8px; width:200px;">
<button onclick="sendMessage()">Send</button>

<script>
function sendMessage(){
    let input = document.getElementById("messageInput");
    let chatBox = document.getElementById("chatBox");

    if(input.value.trim() !== ""){
        chatBox.innerHTML += "<p><b>You:</b> " + input.value + "</p>";
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}
</script>

</body>
</html>
